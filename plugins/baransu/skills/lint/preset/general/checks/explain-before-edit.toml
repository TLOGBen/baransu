# 重新: the first file change of a turn (an edit, or a command that writes a file) came before any words to the user,
# so the model says in a sentence or two how it will make the change, then goes on. A read-only command is no change.
# check holds the call once; error holds every file change until the model has said it.
severity = "retry"
action = "重新"
builtin = "explain-before-edit"
message = "改檔前先用一兩句話說要怎麼動手：改哪些檔、怎麼改"

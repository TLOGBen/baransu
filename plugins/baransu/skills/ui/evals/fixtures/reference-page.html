<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Meridian Type Foundry</title>
<style>
  :root{--ink:#1a1a18;--paper:#efe9dc;--rust:#9a3b1c;--unit:12px}
  html{background:var(--paper);color:var(--ink);font:400 18px/1.5 "Cormorant Garamond",Georgia,serif}
  body{margin:0;max-width:72ch;padding:calc(var(--unit)*6) calc(var(--unit)*4)}
  h1{font:600 96px/0.95 "Cormorant Garamond",Georgia,serif;letter-spacing:-0.02em;margin:0 0 calc(var(--unit)*4)}
  h2{font:500 28px/1.2 "Cormorant Garamond",Georgia,serif;margin:calc(var(--unit)*5) 0 var(--unit)}
  p{margin:0 0 calc(var(--unit)*2)}
  a{color:var(--rust);text-decoration:underline;text-underline-offset:4px}
  .specimen{border-top:2px solid var(--ink);padding-top:var(--unit);font-size:14px;text-align:left}
  .specimen span{display:block;font-size:44px;line-height:1.1}
  @media(prefers-reduced-motion:no-preference){h1{animation:settle .6s ease-out both}@keyframes settle{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style></head><body>
<h1>Meridian</h1>
<p>A type foundry in Porto. We draw serifs for long reading and cut them for the screen.</p>
<h2>Faces</h2>
<div class="specimen"><span>Aurelia Text</span>Regular, Italic, Semibold</div>
<div class="specimen"><span>Corso Display</span>Light through Black</div>
<h2>Licensing</h2>
<p>Desktop, web and app licenses, priced by seat. <a href="#">Read the terms</a>.</p>
</body></html>

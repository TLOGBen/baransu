<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Insights Dashboard</title>
<style>
  body{margin:0;background:#F4F1EA;font-family:Inter,system-ui,sans-serif;color:#111}
  .eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:#777}
  h1{font-size:40px;margin:8px 0 24px}
  h1 em{color:#D97757;font-style:normal}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:32px}
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1);padding:24px;transition:transform .2s}
  .card:hover{transform:translateY(-2px)}
  .stat{font-size:48px;font-weight:700}.label{font-size:12px;color:#888}
  .meta{color:#999;font-size:12px}
  a.cta{display:inline-block;margin-top:12px;color:#D97757}
</style></head><body>
<div class="grid">
  <div style="grid-column:1/-1"><div class="eyebrow">Overview</div><h1>Your <em>insights</em> at a glance</h1><div class="meta">Updated · 5 min ago · 3 sources</div></div>
  <div class="card"><div class="stat">12,480</div><div class="label">ACTIVE USERS</div><a class="cta" href="#">View details →</a></div>
  <div class="card"><div class="stat">3.2%</div><div class="label">CHURN — MONTHLY</div><a class="cta" href="#">View details →</a></div>
  <div class="card"><div class="stat">$48k</div><div class="label">MRR</div><a class="cta" href="#">View details →</a></div>
</div>
</body></html>

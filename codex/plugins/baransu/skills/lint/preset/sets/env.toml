# baransu 合集：環境：暫存路徑、套件安裝、機密
from = "baransu-preset"

# Source: owner's CLAUDE.md — $TMPDIR can be empty (Git Bash on Windows is one such shell).
[check.tmpdir-unset]
severity = "warn"
strict = "warn"
on = ["post:edit"]
file = ["*.sh", "*.bash", "*.zsh", "Makefile"]
forbid = '\$\{?TMPDIR\}?/'
message = "$TMPDIR 在有些環境是空的（例如 Git Bash），$TMPDIR/x 會變成根目錄底下的 /x；改用 ${TMPDIR:-/tmp}/x 或專案內的暫存目錄"

# Source: owner's cli-tools rule — run Python through uv, never pip install into the global interpreter.
# Before a shell command it reads the command line; after an edit, the scripts `file` names (one check, was two).
[check.pip-install-global]
severity = "warn"
strict = "warn"
on = ["pre:bash", "post:edit"]
file = ["*.sh", "*.ps1"]
forbid = '(^|[;&|(]\s*|^\s*)(python3? -m )?pip3? install\b'
message = "不要 pip install 進全域直譯器；用 uv（uv run --with、PEP 723 或 uvx）"

# Source: owner's cli-tools rule — never print a secret; pass it with op run or op inject.
[check.op-secret-to-stdout]
severity = "warn"
strict = "warn"
on = ["post:edit"]
file = ["*.sh", "*.ps1", "Makefile"]
forbid = '^\s*op read\b|\bop item get\b.*--reveal'
message = "secret 會印到輸出和對話紀錄；用 op run --env-file 或 op inject 傳給程式"

<!doctype html>
<!-- Template: .codex/hypothesis/<area>/diagrams.html — the index of the diagram series.
     The figures are drawn by $baransu:draw into diagrams/ (references/diagrams.md); this page lists them in order.
     Replace every {…}; one <figure> per drawn piece. It states no live verdict: it shows the hypothesis as
     published and points at the status command. -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title}｜假說圖組</title>
  <style>
    :root { --bg:#fbfaf7; --fg:#1f2328; --muted:#5d636b; --card:#fff; --line:#e3e0d8; --accent:#2f6f8f; --bad:#b42318; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#15171a; --fg:#e6e6e6; --muted:#a0a6ad; --card:#1d2024; --line:#30343a; --accent:#7fb6d3; --bad:#ff8a80; }
    }
    :root[data-theme="dark"] { --bg:#15171a; --fg:#e6e6e6; --muted:#a0a6ad; --card:#1d2024; --line:#30343a; --accent:#7fb6d3; --bad:#ff8a80; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font:16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
    main { max-width:1040px; margin:0 auto; padding:32px 16px 64px; }
    h1 { font-size:1.6rem; margin:0 0 4px; } h2 { font-size:1.15rem; margin:32px 0 8px; }
    .as-of, figcaption { color:var(--muted); }
    figure { margin:16px 0 28px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
    figure iframe { width:100%; height:560px; border:0; }
    .bad { color:var(--bad); font-weight:600; }
  </style>
</head>
<body>
<main>
  <h1>{title}</h1>
  <p class="as-of">這是第 {generation} 版、同步於 {sync} 時的假說。目前可不可信，以
    <code>hypothesis-status.py --area {area}</code> 的輸出為準。</p>

  <h2>規則</h2>
  <ol><li>{R1 一句白話}</li><!-- one <li> per rule and goal --></ol>

  <h2>圖組</h2>
  <figure>
    <figcaption>圖 1　正常流程：{一句話}</figcaption>
    <iframe src="diagrams/d1-{slug}.html" title="圖 1"></iframe>
  </figure>
  <figure>
    <figcaption>圖 2　加上 {一個元件}：{一句話}</figcaption>
    <iframe src="diagrams/d2-{slug}.html" title="圖 2"></iframe>
  </figure>
  <!-- … one figure per piece; the last is 問題路徑 -->

  <h2>問題路徑</h2>
  <ol><li><span class="bad">P1</span>　{白話摘要}（不成立的規則：{R?}）　<a href="paths/P1.md">劇本</a></li></ol>

  <h2>範圍</h2>
  <p>{範圍、假設、沒涵蓋什麼}。窮舉的結論只在這個範圍內成立。</p>
  <p>沒有形式化的部分：{每一條原因紀錄的白話一句與類別；沒有就寫「全部形式化，沒有例外。」}</p>
</main>
</body>
</html>

# 這個 repo 自己的檢查：預設合集沒有、只對 baransu 有意義的規則。

# The lint engine knows nothing of Claude Code: the host's `$` (and anything reached through it) appears only
# under adapters/. An engine or util file that touches `$.` puts the platform back inside the engine, and the
# next adapter would have to fake Claude Code to reuse it.
[check.engine-no-host]
severity = "error"
on = ["post:edit", "pre:commit", "pre:push", "pre:skill:wrap", "pre:skill:review"]
file = ["plugins/baransu/hooks/engine/**", "plugins/baransu/hooks/util/**"]
forbid = '\$\.[a-z]'
message = "引擎和 util 不碰平台：把需要的東西加成 engine/ports.ts 的 portOut，由 adapters/claude-code 實作"

# Source: owner's CLAUDE.md — Python printing emoji or Chinese raises UnicodeEncodeError under cp950.
# `make ship-check` failed on it on 2026-11-02 until the Makefile exported UTF-8.
[check.makefile-python-utf8]
on = ["post:edit", "pre:commit", "pre:push"]
severity = "error"
file = ["Makefile"]
run = ["git", "grep", "-q", "--untracked", "export PYTHONUTF8", "--", "Makefile"]
message = "Makefile 要保留 export PYTHONIOENCODING := utf-8 與 export PYTHONUTF8 := 1；少了它，make test 在 cp950 的 Windows 上會 UnicodeEncodeError"
scope = "diff"

# Source: CLAUDE.md Non-obvious Invariants — Claude Code discovers skills from the filesystem; a skills array was added in v0.3.0 and reverted.
[check.plugin-json-no-skills-array]
on = ["post:edit", "pre:commit", "pre:push"]
severity = "error"
file = ["**/.claude-plugin/plugin.json", "codex/plugins/baransu/plugin.json"]
forbid = '"skills"\s*:'
message = "plugin.json 不放 skills 陣列；skill 由檔案系統探索"

# Source: CLAUDE.md Non-obvious Invariants — after push the branch is unmerged locally, so -d always fails.
[check.ship-branch-delete-capital-d]
on = ["post:edit", "pre:commit", "pre:push"]
severity = "error"
file = ["plugins/baransu/skills/wrap/**", "codex/plugins/baransu/skills/wrap/**"]
forbid = '\bbranch -d\b'
message = "/wrap 刪分支要用 git -C \"$MAIN_REPO\" branch -D；-d 在 push 後一定失敗"

# Source: 2026-11-03, LintMod.tla Deliver: `ansStepG' = IF d THEN s ELSE ansStepG /\ checksG' = ...` on one line.
# ELSE reaches to the end of the expression, so the next conjunct became part of the ELSE branch; TLC failed
# every run. Flags a value after ELSE followed on the same line by /\ and a primed variable or UNCHANGED.
# ELSE IF ..., ELSE /\ ..., and a /\ inside ( ) or << >> are left alone.
# \x27 is a single quote: a TOML literal string cannot hold one.
[check.tla-else-swallows]
on = ["post:edit", "pre:commit", "pre:push"]
severity = "error"
file = ["*.tla"]
forbid = '\bELSE\s+(?!IF\b|/\\)[^()<>\n]*/\\\s*(\w+\x27|UNCHANGED\b)'
message = "ELSE 會一路吃到運算式結尾，同一行後面的 /\\ 會變成 ELSE 的一部分；把 IF … THEN … ELSE … 整段加上括號，或把下一個條件換到新的一行"

# Source: CLAUDE.md Non-obvious Invariants — third-party sources live in each skill's NOTICE.md, never in the body.
[check.upstream-name-in-body]
on = ["post:edit", "pre:commit", "pre:push"]
severity = "error"
file = ["plugins/baransu/skills/**/*.md", "codex/plugins/baransu/skills/**/*.md"]
ignores = ["**/NOTICE.md"]
forbid = '(?i)pstack|Lauren Tan|cursor/plugins'
message = "上游來源只寫在該 skill 的 NOTICE.md；本文和 references 不點名、不寫授權"

# Source: owner, 2026-11-19 — .claude/ and .codex/ hold working folders that stay out of git (hypothesis, prove-it,
# dogfood were untracked in d85a8018, d1d1eedc). An allowlist, not a list of what is banned: a working folder added
# later is held too. Tracked: .claude/lint/, .claude/settings.json, the runner .claude/verify/*.py (its results/ is a
# run's leftovers), .claude/hypothesis/ (areas with their check.toml; traces/, states/, *.bin and *_TTrace_* are
# git-ignored) and the kept parts of .claude/prove-it/ (recipe.md, features/, fixtures/, replays/; records/ is not).
# The owner's preference, not a hard rule: held once so the model asks, sent again after a yes. Deletions pass,
# so untracking is never held.
[check.working-folders-not-in-git]
on = ["pre:commit"]
severity = "check"
run = ["git", "diff", "--cached", "--quiet", "--diff-filter=AMR", "--", ".claude", ".codex", ":(exclude).claude/lint", ":(exclude).claude/settings.json", ":(exclude,glob).claude/verify/*", ":(exclude).claude/hypothesis", ":(exclude).claude/prove-it/recipe.md", ":(exclude).claude/prove-it/features", ":(exclude).claude/prove-it/fixtures", ":(exclude).claude/prove-it/replays", ":(exclude).claude/skills"]
message = ".claude/ 或 .codex/ 底下只有 .claude/lint/、.claude/settings.json、.claude/verify/run.py、.claude/hypothesis/、.claude/skills/ 與 .claude/prove-it/ 的 recipe、features、fixtures、replays 進 git；暫存區有其他工作資料夾的檔案（含 .claude/verify/results/、.claude/prove-it/records/），使用者偏好不進 git。先問使用者，要放進去再重送（或把它加進這條的白名單）；不要就 git restore --staged 拿掉"

# Source: plugins/baransu/skills/_shared/regression.md §8 — lint only reads the stamps the runner leaves; the judges run outside the session.
# A warning before each commit (a hold on every commit gets turned off); an error before /wrap, so work does not close on a promise nobody checked against this code.
[check.verify-before-commit]
on = ["pre:commit"]
severity = "warn"
run = ["python", ".claude/verify/run.py", "status"]
message = "有驗證過時、失敗或沒跑過；在 session 外跑 python .claude/verify/run.py quick，再照輸出修；synced 之後過時的，先 /baransu:hypothesis --maintain 或 prove-it --maintain，再 run.py sync"

[check.verify-before-wrap]
on = ["pre:skill:wrap"]
severity = "error"
run = ["python", ".claude/verify/run.py", "status"]
message = "驗證沒有全部通過且跟上目前的程式，不能收尾；先在 session 外跑 python .claude/verify/run.py quick，照 status 輸出：1 修程式，2 重跑或修檢查；synced 之後過時的，先 /baransu:hypothesis --maintain 或 prove-it --maintain，再 run.py sync"

from = "baransu-preset@8.35.0"
# Source: owner's cli-tools rule — never print a secret; pass it with op run or op inject.
on = ["post:edit"]
severity = "warn"
files = ["*.sh", "*.ps1", "Makefile"]
forbid = '^\s*op read\b|\bop item get\b.*--reveal'
message = "secret 會印到輸出和對話紀錄；用 op run --env-file 或 op inject 傳給程式"

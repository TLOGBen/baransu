from = "baransu-preset@8.35.0"
# Source: /ship requires every structured file it touched to still parse.
on = ["post:edit"]
severity = "error"
files = ["*.json"]
ignores = ["tsconfig*.json", "jsconfig*.json", ".vscode/**", "devcontainer.json", ".devcontainer/**"]
run = ["jq", "empty", "{file}"]
message = "改完的 JSON 解析失敗；修好語法（帶註解的 JSONC 請加進 ignores）"

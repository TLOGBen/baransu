<!doctype html>
<!-- Structure only. Built by SKILL.md step 7 from README frontmatter, the claim sheet glossary and the traces. -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{area} 假說</title>
  <meta name="hypothesis-revision" content="{revision}">   <!-- the README revision this page was built from -->
  <style>/* tokens on :root, dark mode via prefers-color-scheme; one column on phones */</style>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@{pinned}/dist/mermaid.min.js" integrity="sha384-{pinned hash}" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <h1>{claim}</h1>
    <p class="verdict">{status in Chinese: 成立 / 被推翻 / 草稿 / 無法寫成假說}</p>
    <p class="sync">同步點：{commit or document version}　工具：{tool} {version}　範圍：{bounds}</p>
    <!-- No stale banner: the page cannot know. Readers get stale from the status script. -->
  </header>

  <section id="rules"><!-- each rule as one plain sentence, with its result --></section>

  <section id="diagrams">
    <figure data-step="1"><!-- happy path only, ≤ 7 states --><figcaption>正常流程</figcaption></figure>
    <figure data-step="2"><!-- + one part --><figcaption>這張多了：{part}</figcaption></figure>
    <!-- … one figure per added part … -->
    <figure data-step="last"><!-- bug paths numbered ①②③ --><figcaption>出錯的路徑</figcaption></figure>
  </section>

  <section id="findings"><!-- per finding: number, harm, the numbered steps in the source's words with citations --></section>
  <section id="questions"><!-- document sources: ambiguity questions, to whom --></section>
  <section id="scope"><!-- what is covered, assumed, left out --></section>
  <section id="left-out"><!-- reason records, four columns --></section>
  <footer><!-- how to rerun: the command(s) --></footer>
</body>
</html>
